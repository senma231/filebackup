name: Build agent and push Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false

      - name: Build agent (windows/amd64)
        working-directory: ./agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          echo "=== Building Windows Agent (64-bit) ==="
          echo "Go version:"
          go version
          echo ""
          echo "Environment:"
          echo "GOOS=$GOOS"
          echo "GOARCH=$GOARCH"
          echo "CGO_ENABLED=$CGO_ENABLED"
          echo ""

          go mod tidy
          go mod download

          echo "Building agent.exe..."
          go build -v -ldflags="-s -w" -trimpath -o agent.exe ./cmd

          echo ""
          echo "=== Build completed ==="
          file agent.exe || echo "file command not available"
          ls -lh agent.exe

          # 验证是否为PE32+（64位）格式
          if command -v file > /dev/null; then
            if file agent.exe | grep -q "PE32+"; then
              echo "✅ Successfully built 64-bit Windows executable"
            elif file agent.exe | grep -q "PE32"; then
              echo "❌ WARNING: Built 32-bit executable instead of 64-bit!"
              exit 1
            fi
          fi

      - name: Show agent file
        run: ls -l agent/agent.exe || true

      - name: List agent directory contents
        run: |
          echo "=== Listing agent directory ==="
          ls -la agent/
          echo ""
          echo "=== Checking for .bat files ==="
          ls -la agent/*.bat 2>&1 || echo "No .bat files found"
          echo ""
          echo "=== Checking for configs directory ==="
          ls -la agent/configs/ 2>&1 || echo "No configs directory"
          echo ""
          echo "=== Checking for README.md ==="
          ls -la agent/README.md 2>&1 || echo "No README.md"

      - name: Prepare agent package
        run: |
          mkdir -p agent-package
          cp agent/agent.exe agent-package/
          cp agent/build/setup-agent-template.bat agent-package/setup-agent.bat || echo "WARNING: setup-agent.bat not found"
          cp agent/install-service.bat agent-package/ || echo "WARNING: install-service.bat not found"
          cp agent/start-service.bat agent-package/ || echo "WARNING: start-service.bat not found"
          cp agent/stop-service.bat agent-package/ || echo "WARNING: stop-service.bat not found"
          cp agent/restart-service.bat agent-package/ || echo "WARNING: restart-service.bat not found"
          cp agent/uninstall-service.bat agent-package/ || echo "WARNING: uninstall-service.bat not found"
          cp agent/run-console.bat agent-package/ || echo "WARNING: run-console.bat not found"
          cp agent/README.md agent-package/ || echo "WARNING: README.md not found"
          cp agent/configs/default.json agent-package/config.json || echo "WARNING: config.json not found"
          echo "=== Package file list ==="
          ls -lh agent-package/
          echo ""
          echo "=== Detailed listing ==="
          ls -la agent-package/
          echo ""
          echo "=== Count .bat files ==="
          ls agent-package/*.bat 2>/dev/null | wc -l

      - name: Verify package contents
        run: |
          echo "=== Final verification ==="
          echo "Agent executable:"
          test -f agent-package/agent.exe && echo "  ✓ agent.exe found" || echo "  ✗ agent.exe NOT found"
          echo ""
          echo "Batch files:"
          for bat in install-service start-service stop-service restart-service uninstall-service run-console; do
            file="agent-package/${bat}.bat"
            if [ -f "$file" ]; then
              echo "  ✓ ${bat}.bat found"
            else
              echo "  ✗ ${bat}.bat NOT found"
            fi
          done
          echo ""
          echo "Other files:"
          test -f agent-package/config.json && echo "  ✓ config.json found" || echo "  ✗ config.json NOT found"
          test -f agent-package/README.md && echo "  ✓ README.md found" || echo "  ✗ README.md NOT found"

      - name: Upload agent package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-amd64
          path: agent-package/
          retention-days: 90

      - name: Copy agent to server directory
        run: |
          mkdir -p server/agent_bin
          cp agent/agent.exe server/agent_bin/agent.exe
          echo "=== Verifying agent.exe was copied ==="
          ls -l server/agent_bin/
          file server/agent_bin/agent.exe || echo "file command not available"

      - name: Build installer
        run: |
          echo "=== Building installer.exe ==="
          cd agent

          # 注意：新方案不再需要复制agent.exe，installer会在运行时从服务器下载
          echo "=== Verification before build ==="
          echo "agent.exe size:"
          ls -lh agent.exe
          echo "installer/installer.go exists:"
          ls -lh installer/installer.go

          # 列出installer目录内容
          echo "installer directory contents:"
          ls -la installer/

          # 进入installer目录编译
          cd installer

          # 验证go.mod存在
          if [ ! -f "go.mod" ]; then
            echo "❌ ERROR: go.mod not found in installer directory!"
            echo "This is required for Go module context"
            exit 1
          fi
          echo "✓ go.mod exists"

          # 新方案不再需要agent.exe，installer会运行时下载
          echo "✓ Ready to build runtime downloader"

          # 安装 rsrc 工具（用于嵌入manifest）
          echo "=== Installing rsrc tool ==="
          go install github.com/akavel/rsrc@latest

          # 使用rsrc生成syso文件（包含manifest）
          echo "=== Embedding manifest ==="
          ~/go/bin/rsrc -manifest installer.manifest -o installer.syso
          echo "✓ Manifest embedded as installer.syso"

          export GOOS=windows
          export GOARCH=amd64
          export CGO_ENABLED=0

          echo "=== Starting go build ==="
          # 使用优化选项减小installer体积（现在不需要embed了）
          # installer.syso 会被自动包含到编译中
          echo "Building with optimization flags for smaller binary..."
          go build -v -ldflags="-s -w" -trimpath -o ../../build/installer.exe .

          if [ $? -ne 0 ]; then
            echo "❌ Build failed!"
            exit 1
          fi
          echo "✓ Build completed"

          echo "=== After build ==="
          echo "build/installer.exe size:"
          ls -lh ../../build/installer.exe
          file ../../build/installer.exe || echo "file command not available"

          # 检查 installer.exe 的实际大小
          installer_size=$(stat -c'%s' ../../build/installer.exe 2>/dev/null || stat -f'%z' ../../build/installer.exe)
          agent_size=$(stat -c'%s' ../agent.exe 2>/dev/null || stat -f'%z' ../agent.exe)

          echo ""
          echo "=== Size comparison ==="
          echo "agent.exe size:     $agent_size bytes (~$((agent_size / 1024 / 1024))MB)"
          echo "installer.exe size: $installer_size bytes (~$((installer_size / 1024 / 1024))MB)"

          # 新方案：installer 是运行时下载器，应该很小（< 6MB，优化后的Windows Go程序）
          # 注意：Windows Go程序即使优化后通常也有3-5MB（Go运行时 + 标准库）
          if [ "$installer_size" -gt 6000000 ]; then
            echo "❌ ERROR: installer.exe is too large ($((installer_size / 1024 / 1024))MB)!"
            echo "   Expected: < 6MB (runtime downloader with optimizations)"
            echo "   This suggests possible issues with build"
            exit 1
          elif [ "$installer_size" -lt 1000000 ]; then
            echo "⚠️  WARNING: installer.exe seems too small ($((installer_size / 1024 / 1024))MB)"
            echo "   This might indicate a build issue"
          else
            echo "✅ installer.exe size looks good! (~$((installer_size / 1024 / 1024))MB)"
            echo "   This is a runtime downloader - will download agent.exe when run"
          fi

          # 复制到server目录
          mkdir -p ../../server/agent_bin
          cp ../../build/installer.exe ../../server/agent_bin/DocScannerAgent-Setup.exe

          echo "=== Verifying installer.exe in server/agent_bin ==="
          ls -lh ../../server/agent_bin/DocScannerAgent-Setup.exe
          file ../../server/agent_bin/DocScannerAgent-Setup.exe || echo "file command not available"

          # 检查文件大小是否合理（新方案：应该 < 6MB，因为是优化后的运行时下载器）
          size=$(stat -c'%s' ../../server/agent_bin/DocScannerAgent-Setup.exe 2>/dev/null || stat -f'%z' ../../server/agent_bin/DocScannerAgent-Setup.exe)
          size_mb=$((size / 1024 / 1024))
          if [ "$size" -gt 6000000 ]; then
            echo "⚠ WARNING: installer.exe is too large: ${size_mb}MB (> 6MB)"
            echo "Expected: < 6MB (runtime downloader with optimizations)"
            echo "This suggests possible build issues!"
          elif [ "$size" -lt 1000000 ]; then
            echo "⚠ WARNING: installer.exe seems too small: ${size_mb}MB"
            echo "This might indicate a build issue"
          else
            echo "✓ installer.exe size is ${size_mb}MB (looks good!)"
            echo "  This is a runtime downloader - will fetch agent.exe from server"
          fi

      - name: Verify Docker build context
        run: |
          echo "=== Checking server/agent_bin before Docker build ==="
          ls -la server/agent_bin/
          echo ""
          echo "=== Checking if file exists ==="
          test -f server/agent_bin/agent.exe && echo "✓ agent.exe exists" || echo "✗ agent.exe NOT FOUND!"

      - name: Set lowercase repository owner
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/doc-scanner-server:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/doc-scanner-server:latest
          platforms: linux/amd64

      - name: Cleanup agent binary
        run: rm -f agent/agent.exe || true

      - name: Verify installer before build
        run: |
          echo "=== Final verification before Docker build ==="
          echo "agent_bin directory contents:"
          ls -lh server/agent_bin/
          echo ""
          echo "Checking DocScannerAgent-Setup.exe:"
          if [ -f "server/agent_bin/DocScannerAgent-Setup.exe" ]; then
            echo "✓ DocScannerAgent-Setup.exe exists"
            ls -lh server/agent_bin/DocScannerAgent-Setup.exe
            size=$(stat -c'%s' server/agent_bin/DocScannerAgent-Setup.exe 2>/dev/null || stat -f'%z' server/agent_bin/DocScannerAgent-Setup.exe)
            size_mb=$((size / 1024 / 1024))
            if [ "$size" -gt 6000000 ]; then
              echo "⚠ WARNING: installer.exe is too large (${size_mb}MB)"
              echo "Expected: < 6MB (runtime downloader)"
              echo "Continuing with build..."
            elif [ "$size" -lt 1000000 ]; then
              echo "⚠ WARNING: installer.exe seems too small (${size_mb}MB)"
              echo "Continuing with build..."
            else
              echo "✓ installer.exe size is ${size_mb}MB (looks good!)"
              echo "  Runtime downloader - will fetch agent.exe from server"
            fi
          else
            echo "⚠ WARNING: DocScannerAgent-Setup.exe NOT FOUND!"
            echo "Download will fall back to ZIP package"
            echo "Continuing with build..."
          fi

      - name: Build summary
        run: |
          echo "## 🎉 构建成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker 镜像" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.repo_owner.outputs.owner }}/doc-scanner-server:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.repo_owner.outputs.owner }}/doc-scanner-server:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Windows Agent" >> $GITHUB_STEP_SUMMARY
          echo "已上传为 Artifact: **agent-windows-amd64**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Agent.exe 文件信息：**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh server/agent_bin/agent.exe >> $GITHUB_STEP_SUMMARY 2>&1 || echo "文件大小信息不可用" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sha256sum server/agent_bin/agent.exe >> $GITHUB_STEP_SUMMARY 2>&1 || echo "SHA256校验不可用" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Installer.exe 文件信息：**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh server/agent_bin/DocScannerAgent-Setup.exe >> $GITHUB_STEP_SUMMARY 2>&1 || echo "installer.exe 信息不可用" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sha256sum server/agent_bin/DocScannerAgent-Setup.exe >> $GITHUB_STEP_SUMMARY 2>&1 || echo "SHA256校验不可用" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 部署命令" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ steps.repo_owner.outputs.owner }}/doc-scanner-server:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

