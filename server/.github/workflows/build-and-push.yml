name: Build agent and push Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build agent (windows/amd64)
        working-directory: ./agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p build
          go build -o ../agent/agent.exe ./cmd

      - name: Show agent file
        run: ls -l agent/agent.exe || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doc-scanner-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/doc-scanner-server:latest
          platforms: linux/amd64

      - name: Cleanup agent binary
        run: rm -f agent/agent.exe || true
